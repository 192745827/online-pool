<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>在线台球 — 8球 / 9球</title>
  <link rel="stylesheet" href="./styles.css" />
  <!-- schemapack.js does `import { Buffer } from 'buffer'`; map it to our shim. -->
  <script type="importmap">
    { "imports": { "buffer": "/lib/buffer.js" } }
  </script>
</head>
<body>
  <!-- Connection status strip (reconnecting / opponent reconnecting). A direct
       child of <body>, ABOVE the menu and lobby overlays, because a dropped
       socket is reconnected in every screen — not just in-game — and the strip
       is the only thing telling you why the buttons aren't responding. Unlike
       #banner it never covers the table: the game stays watchable. -->
  <div id="netBanner" class="netBanner hidden"></div>

  <!-- Replay transport, pinned to the bottom of the screen while reviewing a
       past shot. Outside the game stage (like #netBanner) so it sits above the
       menu overlays, and labelled so it is never mistaken for the live table.
       While it is shown, body.reviewing lifts the other bottom-anchored UI
       clear of it. -->
  <div id="replayBar" class="replayBar hidden">
    <span class="replayTag">回放</span>
    <span id="replayWhich" class="replayWhich"></span>
    <button id="replayRestart" title="重新开始">⏮</button>
    <button id="replayStepBack" title="后退一帧 (16 毫秒)">−16</button>
    <button id="replayPlay" title="播放 / 暂停">▶</button>
    <button id="replayStepFwd" title="前进一帧 (16 毫秒)">+16</button>
    <input id="replayScrub" class="replayScrub" type="range" min="0" max="1000" value="0" />
    <span id="replayTime" class="replayTime">0.0 / 0.0 秒</span>
    <button id="replayExit" title="返回实时游戏">✕ 退出</button>
  </div>

  <!-- ===== 菜单 ===== -->
  <div id="menu" class="overlay">
    <div class="panel">
      <h1>在线台球</h1>
      <label class="field">你的名字
        <input id="nameInput" type="text" maxlength="16" placeholder="玩家" />
      </label>
      <label class="field">游戏模式
        <select id="gameSelect">
          <option value="0">8球</option>
          <option value="1">9球</option>
        </select>
      </label>
      <div class="btnRow">
        <button id="btnCreate">创建房间</button>
        <button id="btnQuick">快速开始</button>
        <button id="btnBot">对战电脑</button>
      </div>
      <div class="divider"><span>或使用房间码加入</span></div>
      <div class="btnRow">
        <input id="codeInput" type="text" maxlength="4" placeholder="房间码" class="codeField" />
        <button id="btnJoin">加入</button>
      </div>
      <div id="menuMsg" class="menuMsg"></div>
    </div>
  </div>

  <!-- ===== 大厅（等待中） ===== -->
  <div id="lobby" class="overlay hidden">
    <div class="panel">
      <h1>正在等待对手…</h1>
      <p>分享这个房间码：</p>
      <div id="lobbyCode" class="bigCode">----</div>
      <button id="btnLeaveLobby">取消</button>
    </div>
  </div>

  <!-- ===== 游戏 ===== -->
  <div id="game" class="wrap">
    <div class="stageWrap">
      <canvas id="stage"></canvas>
      <!-- In-game HUD (spin dial, power meter, camera view, pocketed balls),
           drawn over the 3D stage. pointer-events:none so it never eats input. -->
      <canvas id="hudCanvas"></canvas>
      <div id="banner"></div>

      <!-- Top-left hamburger: game actions + collapsible replays + instructions -->
      <div id="sideMenu" class="sideMenu collapsed">
        <button id="menuBtn" class="menuBtn" aria-label="菜单" title="菜单">≡</button>
        <div class="sideMenuBody">
          <div class="btnRow">
            <button id="btnNewGame">新游戏</button>
            <button id="btnLeaveGame">离开</button>
          </div>

          <!-- Collapsible shot-replay player: pick a past shot, then play/pause/
               restart and scrub it like a video (see shotReview.js). -->
          <div id="replayPanel" class="replayPanel collapsed">
            <button id="replayToggle" class="replayToggle">回放 ▸</button>
            <!-- Only the shot PICKER lives in the menu; the transport controls
                 are in #replayBar at the bottom of the screen, where a video
                 player's controls belong. -->
            <div class="replayBody">
              <select id="replaySelect" class="replaySelect"></select>
            </div>
          </div>

          <!-- Collapsible options: aim direction + graphics quality. Both are
               stored per-device in localStorage and applied live (settings.js);
               nothing here needs a reload or a new game. -->
          <div id="optionsPanel" class="optionsPanel collapsed">
            <button id="optionsToggle" class="optionsToggle">Options ▸</button>
            <div class="optionsBody">
              <label class="optCheck" title="Drag the cue instead of the table: the aim follows your finger rather than opposing it.">
                <input id="reverseAim" type="checkbox" />
                <span>Reverse aim</span>
              </label>
              <label class="optCheck" title="Frame rate in the top-right corner. Green is smooth, amber is dropping frames, red is struggling — turn the graphics slider down.">
                <input id="showFps" type="checkbox" />
                <span>Show FPS</span>
              </label>
              <div class="optField">
                <div class="optLabel">Graphics <b id="qualityName">High</b></div>
                <!-- Quantized: 5 presets, step 1, notched by the datalist. -->
                <input id="qualitySlider" class="qualitySlider" type="range"
                       min="0" max="4" step="1" value="3" list="qualityTicks" />
                <datalist id="qualityTicks">
                  <option value="0"></option><option value="1"></option>
                  <option value="2"></option><option value="3"></option>
                  <option value="4"></option>
                </datalist>
                <div id="qualityBlurb" class="optHint"></div>
              </div>
            </div>
          </div>

          <!-- Collapsible instructions -->
          <div id="helpPanel" class="helpPanel collapsed">
            <button id="helpToggle" class="helpToggle">操作说明 ▸</button>
            <div class="helpBody">
              <p><b>拖拽</b>桌面来瞄准（旋转 + 倾斜视角）。点击或拖拽
              <b>旋转拨盘</b>（左下角母球面）设置旋转（<b>X</b> 键重置）。
              要击球，在左侧<b>力量条</b>上抓住球杆并<b>向下</b>拖动 —— 杆头显示力度大小 —— 然后释放。<b>V</b>
              键在瞄准视角和俯视图之间切换；<b>F</b> 键切换自由飞行视角
              （拖拽观看，<b>WASD</b> 移动，<b>Space</b>/<b>Shift</b>
              上下移动）。</p>
              <p>犯规后对方获得<b>手中球</b>（俯视图 —— 移动
              鼠标定位母球，然后点击放置）。</p>
            </div>
          </div>

          <!-- Bot games only: opponent difficulty -->
          <div id="botSkillWrap" class="hidden">
            <span>难度</span>
            <input id="botSkillSlider" type="range" min="0" max="100" value="50" />
          </div>
        </div>
      </div>

      <!-- Frame-rate readout (Options > Show FPS). Top-right is the only corner
           with nothing in it: the menu is top-left, the names top-middle, and
           both bottom corners carry the view/zoom clusters. -->
      <div id="fpsMeter" class="fpsMeter hidden"></div>

      <!-- Top-middle: player names (current turn is bold + underlined) + status -->
      <div id="players" class="players"></div>
      <div class="statusMid">
        <div id="groupInfo"></div>
        <div id="gameMsg"></div>
      </div>

      <!-- Ball-in-hand: appears next to the cue ball; tap to place it there. -->
      <button id="placeConfirm" class="placeConfirm hidden" title="在此放置母球" aria-label="放置母球">✓</button>

      <!-- Bottom-left camera buttons, one per key: swap aim ↔ overhead (V, icon
           shows the view it will take you to) and free-cam on/off (F). -->
      <div id="viewBtns" class="viewBtns">
        <button id="viewBtn" class="viewBtn" title="切换视角">⬇️</button>
        <button id="freeBtn" class="viewBtn" title="自由相机">🎥</button>
      </div>

      <!-- Bottom-right touch controls. Zoom shows in aim / overhead; the movement
           pad shows in free-fly. main.js toggles them by view. -->
      <div id="zoomControls" class="ctrlCluster hidden">
        <button id="zoomIn" class="ctrlBtn" aria-label="放大">＋</button>
        <button id="zoomOut" class="ctrlBtn" aria-label="缩小">－</button>
      </div>
      <div id="freeControls" class="ctrlCluster hidden">
        <div class="dpad">
          <button id="freeFwd" class="ctrlBtn" aria-label="向前">↑</button>
          <div class="dpadRow">
            <button id="freeLeft" class="ctrlBtn" aria-label="向左">←</button>
            <button id="freeRight" class="ctrlBtn" aria-label="向右">→</button>
          </div>
          <button id="freeBack" class="ctrlBtn" aria-label="向后">↓</button>
        </div>
        <div class="updown">
          <button id="freeUp" class="ctrlBtn" aria-label="向上">⤒</button>
          <button id="freeDown" class="ctrlBtn" aria-label="向下">⤓</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Ammo global (wasm build) for the client renderer is NOT needed: the client
       has no physics. Only Three + the networked modules run here. -->
  <script type="module" src="./lib/three.module.js"></script>
  <script type="module" src="./src/client/main.js"></script>
</body>
</html>
